<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">SentinelGuard</title>
  <desc id="d">SentinelGuard — autonomous emergency halt and self-tuning governance for GenLayer</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F3F1FF"/>
      <stop offset="1" stop-color="#EAF7FF"/>
    </linearGradient>
    <linearGradient id="shield" x1="10" y1="4" x2="90" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D5DF5"/>
      <stop offset="1" stop-color="#2686C4"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D5DF5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2686C4" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#6D5DF5" fill-opacity="0.16"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6D5DF5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6D5DF5" stop-opacity="0"/>
    </radialGradient>
    <symbol id="sg" viewBox="0 0 100 112">
      <path d="M50 4 L90 21 V54.5 C90 80 70.5 96 50 108 C29.5 96 10 80 10 54.5 V21 Z" fill="url(#shield)"/>
      <path d="M50 8.5 L86 24 V54.5 C86 78 68 92.8 50 103.6 C32 92.8 14 78 14 54.5 V24 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
      <path d="M28 55 C34 42 44 36 50 36 C56 36 66 42 72 55 C66 68 56 74 50 74 C44 74 34 68 28 55 Z" fill="#FFFFFF" fill-opacity="0.92"/>
      <circle cx="50" cy="55" r="9" fill="#251E63"/>
      <circle cx="53.2" cy="51.8" r="2.6" fill="#FFFFFF"/>
    </symbol>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#dots)"/>

  <!-- left: wordmark -->
  <use href="#sg" x="84" y="86" width="108" height="121"/>
  <text x="222" y="152" font-family="'Space Grotesk','Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-2" fill="#1A1B2E">Sentinel<tspan fill="#5744E0">Guard</tspan></text>
  <text x="224" y="198" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" fill="#6B7089">Autonomous emergency halt &amp; self-tuning governance.</text>
  <text x="224" y="232" font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" fill="#6B7089">No proposal. No committee. No one votes.</text>

  <g font-family="'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="224" y="264" width="262" height="34" rx="17" fill="#EFEDFF" stroke="#B9B0FF" stroke-opacity="0.7"/>
    <text x="355" y="286" text-anchor="middle" fill="#5744E0">GenLayer · Autonomous Protocols</text>
    <rect x="500" y="264" width="112" height="34" rx="17" fill="#E9F8F0" stroke="#8FDCB8"/>
    <text x="556" y="286" text-anchor="middle" fill="#123F30">Studionet</text>
  </g>

  <!-- right: validator consensus around the shield -->
  <g transform="translate(1010 180)">
    <circle r="150" fill="url(#glow)"/>
    <circle r="118" fill="none" stroke="#6D5DF5" stroke-opacity="0.28" stroke-dasharray="3 7"/>
    <g stroke="url(#beam)" stroke-width="1.6" stroke-linecap="round">
      <line x1="-96" y1="-70" x2="0" y2="0"/>
      <line x1="72" y1="-92" x2="0" y2="0"/>
      <line x1="118" y1="8" x2="0" y2="0"/>
      <line x1="30" y1="112" x2="0" y2="0"/>
      <line x1="-108" y1="52" x2="0" y2="0"/>
    </g>
    <g>
      <circle cx="-96" cy="-70" r="11" fill="#FFFFFF" stroke="#6D5DF5" stroke-width="2.5"/>
      <circle cx="72" cy="-92" r="11" fill="#FFFFFF" stroke="#2686C4" stroke-width="2.5"/>
      <circle cx="118" cy="8" r="11" fill="#FFFFFF" stroke="#6D5DF5" stroke-width="2.5"/>
      <circle cx="30" cy="112" r="11" fill="#FFFFFF" stroke="#2686C4" stroke-width="2.5"/>
      <circle cx="-108" cy="52" r="11" fill="#FFFFFF" stroke="#6D5DF5" stroke-width="2.5"/>
      <circle cx="-96" cy="-70" r="4" fill="#6D5DF5"/>
      <circle cx="72" cy="-92" r="4" fill="#2686C4"/>
      <circle cx="118" cy="8" r="4" fill="#6D5DF5"/>
      <circle cx="30" cy="112" r="4" fill="#2686C4"/>
      <circle cx="-108" cy="52" r="4" fill="#6D5DF5"/>
    </g>
    <use href="#sg" x="-48" y="-54" width="96" height="108"/>
  </g>
</svg>
